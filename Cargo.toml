[package]
name = "ultranix-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Rust MCP server for Linux desktop automation — Wayland/Hyprland-first"
license = "ISC"
repository = "https://github.com/jxoesneon/ultranix-mcp"
keywords = ["mcp", "linux", "wayland", "hyprland", "automation"]
categories = ["command-line-utilities"]

[dependencies]
rmcp = { version = "3.3", features = ["server", "transport-io", "transport-streamable-http-server"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
async-trait = "0.1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
axum = "0.8.9"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
