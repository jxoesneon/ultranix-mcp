[package]
name = "ultranix-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Rust MCP server for Linux desktop automation — Wayland/Hyprland-first"
license = "ISC"
repository = "https://github.com/jxoesneon/ultranix-mcp"
keywords = ["mcp", "linux", "wayland", "hyprland", "automation"]
categories = ["command-line-utilities"]

[dependencies]
rmcp = { version = "3.3", features = ["server", "transport-io", "transport-streamable-http-server"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
async-trait = "0.1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
axum = "0.8.9"
rand = "0.10"
libc = "0.2"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
wayland-client = "0.31.15"
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
wayland-protocols-misc = { version = "0.3.12", features = ["client"] }
xkbcommon = "0.9"
image = { version = "0.25.9", default-features = false, features = ["png"] }
tempfile = "3.27.0"
atspi = { version = "0.30", default-features = false, features = ["connection", "proxies", "tokio", "zbus"] }
# default-features=false drops the `udev` feature (libudev): Builder::default()
# then opens /dev/uinput directly, matching the provider's probe semantics.
uinput = { version = "0.1.3", default-features = false }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
