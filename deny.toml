# cargo-deny configuration for ultranix-mcp
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
# Permissive on unmaintained/yanked, strict on vulnerabilities.
# cargo-deny ≥0.18 removed `vulnerability`/`unsound`/`notice` (all now
# error unconditionally) and changed `unmaintained` to a scope:
# all | workspace | transitive | none. `workspace` fails only when a
# DIRECT dep is unmaintained — transitive strays still surface via
# `cargo audit` informational warnings.
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
unmaintained = "workspace"
yanked = "warn"
ignore = []

[bans]
# No banned crates; duplicate versions are allowed for now.
multiple-versions = "allow"
wildcards = "allow"
deny = []
highlight = "all"

[licenses]
confidence-threshold = 0.8
allow = [
  "ISC",
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "Zlib",
  "Unicode-DFS-2016",
  "Unicode-3.0",
  "MPL-2.0",
  "CC0-1.0",
  # `uinput`/`uinput-sys` (/dev/uinput input provider) are WTFPL.
  "WTFPL",
]
exceptions = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
