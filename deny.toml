# cargo-deny configuration for ultranix-mcp
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
# Permissive: surface advisories but do not hard-fail on unmaintained/yanked
# crates while the dependency tree is still settling during early phases.
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
vulnerability = "deny"
unmaintained = "warn"
yanked = "warn"
notice = "warn"
ignore = []

[bans]
# No banned crates; duplicate versions are allowed for now.
multiple-versions = "allow"
wildcards = "allow"
deny = []
highlight = "all"

[licenses]
confidence-threshold = 0.8
allow = [
  "ISC",
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "Zlib",
  "Unicode-DFS-2016",
  "Unicode-3.0",
  "MPL-2.0",
  "CC0-1.0",
  # `uinput`/`uinput-sys` (/dev/uinput input provider) are WTFPL.
  "WTFPL",
]
exceptions = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
