name: OCI image

# Builds and publishes ghcr.io/jxoesneon/ultranix-mcp on every version tag.
# The image reference is consumed by server.json
# (`ghcr.io/jxoesneon/ultranix-mcp:<version>` — note the registry tag drops
# the `v` prefix, matching the schema's package `version` field).
on:
  push:
    tags:
      - 'v*'
  # Manual rebuild of the currently checked-out ref (e.g. base-image
  # refresh). Pushes `latest` plus whatever tag name matches.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/jxoesneon/ultranix-mcp

jobs:
  publish:
    # `env` is not in `jobs.<id>.name`'s allowed contexts — literal only.
    name: Build & push ghcr.io/jxoesneon/ultranix-mcp
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # latest=auto: a prerelease tag (v1.5.0-rc.1) publishes only
          # its semver tag — `latest` moves on final releases (and
          # manual default-branch runs), never on prereleases.
          flavor: |
            latest=auto
          # v1.4.0 -> 1.4.0 (server.json identifier has no `v` prefix).
          # A `#` line inside the block scalar would be literal input —
          # keep comments outside `tags:`.
          tags: |
            type=semver,pattern={{version}}

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Smoke-test build first: load into the local daemon and run
      # `--help` (clap exits 0) before anything is pushed. The push build
      # below reuses the cached layers, so this costs one compile total.
      - name: Build image (local, for smoke test)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ultranix-mcp:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test — `ultranix-mcp --help`
        run: docker run --rm ultranix-mcp:smoke --help

      - name: Build & push ${{ env.IMAGE }}
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
