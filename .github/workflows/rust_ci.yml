name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # `labeled` added so the `nested-live` job can be triggered on a PR by
    # applying the `live` label; every other job already ran on
    # opened/synchronize/reopened.
    types: [opened, synchronize, reopened, labeled]
  # Manual dispatch is the primary gate for the nested-compositor rig —
  # github-hosted runners ship no Wayland compositor.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      # pipewire-sys/libspa-sys resolve libpipewire-0.3 via pkg-config at
      # build time (unconditional `pipewire` dep since v1.1.0).
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwayland-dev libxkbcommon-dev libpipewire-0.3-dev

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwayland-dev libxkbcommon-dev libpipewire-0.3-dev

      # The suite must run headless: mock providers cover the full tool
      # surface, so no Wayland session or display server is required.
      - name: Run tests
        run: cargo test --all-targets

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwayland-dev libxkbcommon-dev libpipewire-0.3-dev

      - name: Generate coverage report
        run: cargo llvm-cov --all-targets --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # Phase-5 nested-compositor rig (docs/TESTING_STRATEGY.md §2.2, ROADMAP
  # Phase 5). Never runs on a default push: Hyprland isn't packaged for
  # GitHub runners, so this job installs sway and runs it headless
  # (WLR_BACKENDS=headless + pixman). wlroots advertises
  # wlr-screencopy even headless, so the screenshot PNG assertion is fully
  # exercised; get_windows correctly returns -32010 (the window provider
  # is hyprctl-only). On a self-hosted CachyOS/Hyprland runner the same
  # script auto-detects `Hyprland` and exercises the nested-in-session
  # path instead — trigger it there with `workflow_dispatch`.
  nested-live:
    name: nested compositor (live)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'live'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      # sway is in Ubuntu universe; it needs no seat/GPU under
      # WLR_BACKENDS=headless. python3 (JSON-RPC driver) is preinstalled
      # on GH-hosted images. libpipewire-0.3-dev is the pkg-config input
      # for pipewire-sys (unconditional `pipewire` dep since v1.1.0).
      - name: Install headless compositor and native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends sway \
            pkg-config libwayland-dev libxkbcommon-dev libpipewire-0.3-dev

      - name: Build server
        run: cargo build --bin ultranix-mcp

      - name: Run nested-compositor rig
        run: bash scripts/nested-test.sh --compositor sway
        env:
          ULTRANIX_MCP_BIN: ${{ github.workspace }}/target/debug/ultranix-mcp

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan for vulnerable dependencies
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
